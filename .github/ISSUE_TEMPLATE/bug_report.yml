name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Before filing, please try updating first. Many issues are already fixed.
        On a Mac: `curl -fsSL https://raw.githubusercontent.com/andrewgwoodruff/shall-not-pass/main/install.sh | bash`
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Mac app
        - Browser extension
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? For the browser extension, which site?
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and browser
      description: Your OS version, and your browser and its version if it's the extension.
      placeholder: e.g. macOS 15.3 (Apple Silicon), Chrome 142
    validations:
      required: true
  - type: input
    id: spotify
    attributes:
      label: Spotify app version (Mac app only)
      description: Spotify menu → About Spotify
      placeholder: e.g. 1.2.98.301
  - type: dropdown
    id: mode
    attributes:
      label: Which version is running? (Mac app only)
      description: The first line of the log says "event-driven" or "poll interval".
      options:
        - Event-driven (Swift)
        - Shell fallback (polling)
        - Not sure
  - type: textarea
    id: log
    attributes:
      label: Log (Mac app only)
      description: Output of `tail -50 ~/Library/Logs/shall-not-pass.log`
      render: text
