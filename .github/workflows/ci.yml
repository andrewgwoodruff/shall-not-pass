name: macOS

on:
  push:
    paths: ["macos/**", "install.sh", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["macos/**", "install.sh", ".github/workflows/ci.yml"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=warning *.sh macos/*.sh

  macos:
    runs-on: macos-latest
    env:
      # Quick installs download from GitHub; point them at the commit under
      # test instead of main.
      SHALL_NOT_PASS_REPO_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the embedded Swift daemon
        run: macos/shall-not-pass.sh --build

      - name: Daemon starts, watches, and exits cleanly on SIGTERM
        run: |
          macos/shall-not-pass.sh > daemon.log 2>&1 &
          pid=$!
          sleep 3
          kill -TERM "$pid"
          wait "$pid"
          cat daemon.log
          grep -q "event-driven" daemon.log
          grep -q "Goodbye" daemon.log

      # Real installs into a throwaway $HOME. launchctl and osascript are
      # stubbed so nothing is registered on the runner.
      - name: Install into a sandbox
        run: |
          sandbox="$RUNNER_TEMP/sandbox"
          mkdir -p "$sandbox/home" "$sandbox/bin"
          printf '#!/bin/bash\necho "launchctl $*" >> "%s/launchctl.log"\n' "$sandbox" > "$sandbox/bin/launchctl"
          printf '#!/bin/bash\nexit 0\n' > "$sandbox/bin/osascript"
          chmod +x "$sandbox/bin/"*
          export HOME="$sandbox/home" PATH="$sandbox/bin:$PATH"
          dir="$HOME/.local/share/shall-not-pass"

          # From a clone
          macos/install.sh
          test -x "$dir/shall-not-pass.sh"
          test -x "$dir/uninstall.sh"
          test -x "$dir/update.sh"
          grep -q "method=manual" "$dir/install-info"
          grep -q "source=$PWD/macos" "$dir/install-info"
          plutil -lint "$HOME/Library/LaunchAgents/com.shall-not-pass.plist"
          grep -q "load -w" "$sandbox/launchctl.log"
          "$dir/uninstall.sh"
          test ! -e "$dir"

          # The root install.sh, from a clone (what older update.sh runs)
          ./install.sh
          grep -q "method=manual" "$dir/install-info"
          "$dir/uninstall.sh"

          # Piped like curl | bash, from inside the repo: it must download from
          # GitHub, not install whatever is in the current folder.
          bash < install.sh
          grep -q "method=quick" "$dir/install-info"
          cmp "$dir/shall-not-pass.sh" macos/shall-not-pass.sh
          plutil -lint "$HOME/Library/LaunchAgents/com.shall-not-pass.plist"

          # A quick install updates through the root install.sh
          "$dir/update.sh"
          grep -q "method=quick" "$dir/install-info"
          "$dir/uninstall.sh"
          test ! -e "$dir"
